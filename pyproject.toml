[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "campus_energy_forecaster"
version = "0.2.0"
description = "Building energy forecasting and efficiency tool: waste detection and outage-runtime planning from hourly meter data."
authors = [{ name = "Aslan Shaukat Vaida" }]
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn>=1.4"]

[tool.setuptools]
packages = ["campus_energy_forecaster"]
