[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "campus_energy_forecaster"
version = "0.1.0"
description = "Predicting campus building energy usage from usage history, weather, occupancy and building info (competition, )."
authors = [{ name = "Aslan Shaukat Vaida" }]
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn==1.8.0", "xgboost==3.4.1", "matplotlib", "seaborn"]

[project.optional-dependencies]
external = ["kagglehub"]

[tool.setuptools]
packages = ["campus_energy_forecaster", "campus_energy_forecaster.modeling"]
